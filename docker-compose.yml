services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trip-planner-frontend
    env_file:
      - .env.docker
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://host.docker.internal:4000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-openStreetMap}
      NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/en >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  frontend_next:
